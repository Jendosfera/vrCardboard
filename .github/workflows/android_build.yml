name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Скачиваем код игры
        uses: actions/checkout@v4

      - name: Настраиваем шаблоны и ключ подписи
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Собираем APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/vr_shooter.apk

      - name: Загружаем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-shooter-apk
          path: build/android/vr_shooter.apk
