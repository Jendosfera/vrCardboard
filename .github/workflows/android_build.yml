name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код игры
        uses: actions/checkout@v4

      - name: Настраиваем Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Скачиваем Godot 4.6 и шаблоны экспорта
        run: |
          wget -q https://github.com
          wget -q https://github.com
          unzip -q Godot_v4.6-stable_linux.x86_64.zip
          mv Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          unzip -q Godot_v4.6-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.6.stable/

      - name: Собираем APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/vr_shooter.apk

      - name: Загружаем готовый APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: vr-shooter-apk
          path: build/android/vr_shooter.apk
