name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код игры
        uses: actions/checkout@v4

      - name: Настраиваем Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Устанавливаем Godot 4.6 и шаблоны
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Настраиваем Android SDK, Java и абсолютные пути к ключам
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          
          # Заменяем res://debug.keystore на реальный абсолютный путь в export_presets.cfg
          sed -i "s|res://debug.keystore|$GITHUB_WORKSPACE/debug.keystore|g" export_presets.cfg
          
          # Проверяем, где лежат шаблоны экспорта, и дублируем их во все возможные папки Godot 4.6
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          find ~/.local/share/godot/export_templates -type f -exec cp -n {} ~/.local/share/godot/export_templates/4.6.stable/ \; || true
          
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.6.tres

            - name: Собираем APK
        run: |
          echo "=== Проверка шаблонов ==="
          ls -la ~/.local/share/godot/export_templates/4.6.stable/
          echo "=== Проверка export_presets.cfg ==="
          cat export_presets.cfg
          echo "=== Проверка Android SDK ==="
          ls -la "$ANDROID_HOME/build-tools/"
          mkdir -p build/android
          godot --headless --verbose --export-release "Android" build/android/vr_shooter.apk


      - name: Загружаем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-shooter-apk
          path: build/android/vr_shooter.apk
