name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код игры
        uses: actions/checkout@v4

      - name: Настраиваем Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Устанавливаем Godot 4.6 и шаблоны
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Настраиваем ключи и проверяем конфигурацию
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          sed -i "s|res://debug.keystore|$GITHUB_WORKSPACE/debug.keystore|g" export_presets.cfg
          
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.6.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          cat <<EOF > check_export.gd
          @tool
          extends EditorScript
          func _run():
              for i in range(EditorExportPlatformAndroid.get_export_presets_count() if ClassDB.class_exists("EditorExportPlatformAndroid") else 0):
                  pass
              print("JAVA_HOME=", OS.get_environment("JAVA_HOME"))
              print("ANDROID_HOME=", OS.get_environment("ANDROID_HOME"))
              print("EDITOR_JAVA=", EditorInterface.get_editor_settings().get_setting("export/android/java_sdk_path"))
              print("EDITOR_ANDROID=", EditorInterface.get_editor_settings().get_setting("export/android/android_sdk_path"))
          EOF
          godot --headless --editor --quit --script check_export.gd || true

      - name: Собираем APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/vr_shooter.apk

      - name: Загружаем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-shooter-apk
          path: build/android/vr_shooter.apk
