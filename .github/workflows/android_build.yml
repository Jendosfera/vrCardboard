name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код игры
        uses: actions/checkout@v4

      - name: Настраиваем Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Устанавливаем Godot 4.6 и шаблоны
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Собираем APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/vr_shooter.apk

      - name: Загружаем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-shooter-apk
          path: build/android/vr_shooter.apk
