name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код игры
        uses: actions/checkout@v4

      - name: Настраиваем Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Устанавливаем Godot 4.6 и шаблоны
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Упаковываем игру и собираем APK через Gradle
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/4.6.stable/android_source.zip -d android/build
          
          cat <<EOF > export_presets.cfg
          [preset.0]

          name="Pack"
          platform="Linux"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="android/build/assets/main.pck"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          binary_format/architecture="x86_64"
          EOF

          mkdir -p android/build/assets
          godot --headless --export-pack "Pack" android/build/assets/main.pck
          cp android/build/assets/main.pck android/build/assets/main.pack
          ls -lh android/build/assets/

          cd android/build
          chmod +x gradlew
          ./gradlew assembleStandardDebug
          find build/outputs/apk -name "*.apk"

      - name: Загружаем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-shooter-apk
          path: android/build/build/outputs/apk/**/*.apk
