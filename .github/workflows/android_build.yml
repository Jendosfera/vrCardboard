name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Скачиваем код игры
        uses: actions/checkout@v4

      - name: Настраиваем шаблоны, Java SDK и ключ подписи
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          echo "Найден Java SDK: $JAVA_PATH"
          
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.6.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Собираем APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/vr_shooter.apk

      - name: Загружаем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-shooter-apk
          path: build/android/vr_shooter.apk
