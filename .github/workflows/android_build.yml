name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код игры
        uses: actions/checkout@v4

      - name: Настраиваем Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Устанавливаем Godot 4.6 и шаблоны
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Собираем APK напрямую через Gradle
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/4.6.stable/android_source.zip -d android/build
          
          mkdir -p android/build/assets
          godot --headless --export-pack "Android" android/build/assets/main.pack || godot --headless --pack android/build/assets/main.pack || true
          
          cd android/build
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Загружаем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-shooter-apk
          path: android/build/build/outputs/apk/debug/*.apk
